name: ABM Map Builder

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      country:
        description: "Country code(s) from countries.json: IR,AM or all"
        required: true
        default: "IR"
      force:
        description: "Force rebuild even if source/build inputs are unchanged"
        type: boolean
        required: true
        default: false
      publish:
        description: "Publish validated ABM and manifest to maps-v4"
        type: boolean
        required: true
        default: true
      regions:
        description: "Optional province/region codes, e.g. IR-ESF,IR-KER (empty = country/all configured regions)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: abm-maps-v4-publisher
  cancel-in-progress: false

env:
  RELEASE_TAG: maps-v4
  MAX_ASSET_BYTES: "1932735283"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  # ------------------------------------------------------------
  # 1) Discover countries
  # ------------------------------------------------------------
  discover:
    name: Discover countries
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate repository and create matrix
        id: matrix
        env:
          REQUESTED: ${{ github.event_name == 'schedule' && (vars.WEEKLY_COUNTRIES || 'IR') || inputs.country }}
          REQUESTED_REGIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.regions || '' }}
        shell: bash
        run: |
          set -euo pipefail

          test -f countries.json || {
            echo "::error::countries.json not found"
            exit 1
          }

          python3 - <<'PY'
          import json
          import os

          with open("countries.json", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict) or not data:
              raise SystemExit("countries.json must be a non-empty object")

          requested = (os.environ.get("REQUESTED") or "IR").replace(" ", "").upper()
          requested_regions = [x.strip().upper() for x in os.environ.get("REQUESTED_REGIONS", "").split(",") if x.strip()]

          if requested_regions:
              region_countries = list(dict.fromkeys(x.split("-", 1)[0] for x in requested_regions))
              if requested in ("", "ALL"):
                  codes = region_countries
              else:
                  codes = [x for x in requested.split(",") if x and x in region_countries]
              if not codes:
                  raise SystemExit("The selected regions do not belong to the selected country/countries")
          elif requested in ("", "ALL"):
              codes = list(data.keys())
          else:
              codes = [x for x in requested.split(",") if x]

          unknown = [x for x in codes if x not in data]
          if unknown:
              raise SystemExit(f"Unknown country code(s): {unknown}")

          include = []
          for code in codes:
              item = data[code]
              if not isinstance(item, dict):
                  raise SystemExit(f"{code}: country configuration is not an object")

              url = item.get("pbf_url") or item.get("url")
              if not url:
                  raise SystemExit(f"{code}: pbf_url/url is missing")

              requested_regions = [x.strip().upper() for x in os.environ.get("REQUESTED_REGIONS", "").split(",") if x.strip()]
              selected_regions = [x for x in requested_regions if x.startswith(code + "-")]
              include.append({
                  "code": code,
                  "pbf_url": url,
                  "regions_config": item.get("regions_config", ""),
                  "requested_regions": selected_regions
              })

          matrix = {"include": include}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")

          print("Selected:", ", ".join(codes))
          PY

  # ------------------------------------------------------------
  # 2) Build one country per runner
  # ------------------------------------------------------------
  build:
    name: Build ${{ matrix.code }}
    needs: discover
    if: ${{ fromJSON(needs.discover.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    env:
      CODE: ${{ matrix.code }}
      REQUESTED_REGIONS: ${{ join(matrix.requested_regions, ',') }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify builder layout
        shell: bash
        run: |
          set -euo pipefail

          test -f build_abm.py
          test -f requirements.txt
          test -f release_packaging/build_release_manifest.py
          test -f release_packaging/prepare_release.py

          # Optional helper is allowed, but if it exists it is used.
          if [ -f release_packaging/check_source.py ]; then
            echo "CHECK_SOURCE=1" >> "$GITHUB_ENV"
          else
            echo "CHECK_SOURCE=0" >> "$GITHUB_ENV"
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Admin-1 boundary dataset
        uses: actions/cache@v5
        with:
          path: ~/.cache/abtinmaps/admin1.geojson
          key: abtinmaps-admin1-v1

      - name: Prepare Admin-1 boundary cache path
        shell: bash
        run: |
          mkdir -p ~/.cache/abtinmaps
          echo "ADMIN1_CACHE=$HOME/.cache/abtinmaps/admin1.geojson" >> "$GITHUB_ENV"

      - name: Prepare country region configuration
        shell: bash
        run: |
          set -euo pipefail

          regions="${{ matrix.regions_config }}"
          if [ -z "$regions" ]; then
            python3 tools/generate_regions_from_admin1.py \
              --country "$CODE" \
              --countries countries.json \
              --output generated_regions
            if [ -f "generated_regions/$CODE.json" ]; then
              regions="generated_regions/$CODE.json"
            fi
          elif [ ! -f "$regions" ] && [ -f "sample/$regions" ]; then
            regions="sample/$regions"
          fi

          echo "REGIONS_CONFIG=$regions" >> "$GITHUB_ENV"
          if [ -n "$regions" ]; then
            echo "Using regional build config: $regions"
          else
            echo "No Admin-1 regions for $CODE; using one whole-country ABM."
          fi

      - name: Free runner disk space
        shell: bash
        run: |
          set -eux
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /usr/local/lib/heroku || true
          sudo docker system prune -af || true
          df -h /

      - name: Read current release manifest and assets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf prev dist stage fragment source
          mkdir -p prev dist stage fragment source

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" \
              --pattern manifest.json \
              --dir prev \
              --clobber || true
            gh release view "$RELEASE_TAG" --json assets > prev/assets.json
          else
            printf '%s\n' '{"assets":[]}' > prev/assets.json
          fi

          if [ -f prev/manifest.json ]; then
            echo "Previous manifest found."
          else
            echo "No previous manifest."
          fi

      - name: Determine whether rebuild is required
        id: source
        env:
          FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && (inputs.force || inputs.regions != '') || false }}
        shell: bash
        run: |
          set -euo pipefail

          changed=true

          if [ "$FORCE_INPUT" = "true" ]; then
            echo "Forced rebuild requested."
          elif [ "$CHECK_SOURCE" = "1" ]; then
            set +e
            python3 release_packaging/check_source.py check "$CODE" \
              --url "${{ matrix.pbf_url }}" \
              --previous-manifest prev/manifest.json \
              --assets-json prev/assets.json \
              --regions-config "$REGIONS_CONFIG"
            rc=$?
            set -e

            if [ "$rc" -eq 10 ]; then
              changed=false
            elif [ "$rc" -ne 0 ]; then
              echo "::error::check_source.py failed with exit code $rc"
              exit "$rc"
            fi
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "SRC_CHANGED=$changed" >> "$GITHUB_ENV"

      - name: Install builder dependencies
        if: steps.source.outputs.changed == 'true'
        run: pip install -r requirements.txt

      - name: Download OSM source
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          URL="${{ matrix.pbf_url }}"
          UA="abtin-maps-builder (+github-actions)"

          download() {
            curl -fL \
              --max-redirs 10 \
              --retry 3 \
              --retry-delay 20 \
              --connect-timeout 30 \
              --max-time 0 \
              -A "$UA" \
              -D source/headers.txt \
              -o source/input.osm.pbf \
              "$1"
          }

          if ! download "$URL"; then
            echo "::warning::Direct download failed; redirect chain follows"
            curl -sI --max-redirs 10 -L -A "$UA" "$URL" | grep -iE '^(HTTP|location|server|retry-after)' || true
            # Resolve the dated file name once, then fetch it directly.
            DATED="$(curl -s -o /dev/null -w '%{redirect_url}' -A "$UA" "$URL" || true)"
            if [ -n "$DATED" ] && [ "$DATED" != "$URL" ]; then
              echo "Retrying with resolved URL: $DATED"
              download "$DATED"
            else
              echo "::error::Could not download $URL (see redirect chain above)"
              exit 1
            fi
          fi

          test -s source/input.osm.pbf
          ls -lh source/input.osm.pbf

      - name: Fingerprint changed provinces
        if: steps.source.outputs.changed == 'true' && env.REGIONS_CONFIG != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "Fingerprinting regional source in a single PBF pass..."
          python3 release_packaging/check_region_source.py \
            source/input.osm.pbf \
            --regions-config "$REGIONS_CONFIG" \
            --output source/region-fingerprints.json
          test -s source/region-fingerprints.json
          echo "Regional fingerprints created:"
          cat source/region-fingerprints.json

      - name: Record source metadata
        if: steps.source.outputs.changed == 'true' && env.CHECK_SOURCE == '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 release_packaging/check_source.py finalize "$CODE" \
            --pbf source/input.osm.pbf \
            --headers source/headers.txt \
            --previous-manifest prev/manifest.json \
            --dist dist \
            --regions-config "$REGIONS_CONFIG" \
            $(if [ -f source/region-fingerprints.json ]; then echo --region-fingerprints source/region-fingerprints.json; fi)

      - name: Select changed provinces
        id: regions
        if: steps.source.outputs.changed == 'true' && env.REGIONS_CONFIG != ''
        shell: bash
        env:
          FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from release_packaging.check_source import builder_hash
          cfg = json.loads(Path(os.environ['REGIONS_CONFIG']).read_text(encoding='utf-8'))
          prev = {}
          pp = Path('prev/manifest.json')
          if pp.exists():
              data=json.loads(pp.read_text(encoding='utf-8'))
              prev={str(x.get('code')): x for x in data.get('countries',[]) if isinstance(x,dict)}
          fps=json.loads(Path('source/region-fingerprints.json').read_text(encoding='utf-8'))
          current_builder=builder_hash(os.environ['REGIONS_CONFIG'])
          force=os.environ.get('FORCE_INPUT')=='true'
          requested={x.strip().upper() for x in os.environ.get('REQUESTED_REGIONS','').split(',') if x.strip()}
          changed=[]
          for r in cfg.get('regions',[]):
              code=str(r['code']).strip().upper()
              old=(prev.get(code,{}).get('source') or {})
              same=(old.get('region_pbf_sha256') == (fps.get(code) or {}).get('sha256')
                    and old.get('builder_hash') == current_builder
                    and prev.get(code,{}).get('sha256'))
              if requested:
                  if code in requested: changed.append(code)
              elif force or not same:
                  changed.append(code)
          print('Changed regions:', ','.join(changed) if changed else '(none)')
          out=Path(os.environ['GITHUB_OUTPUT'])
          out.write_text(f"codes={','.join(changed)}\nneeded={'true' if changed else 'false'}\n", encoding='utf-8')
          PY
          echo "REGION_CODES=${{ steps.regions.outputs.codes }}" >> "$GITHUB_ENV"

      - name: Build ABM
        if: steps.source.outputs.changed == 'true' && (env.REGIONS_CONFIG == '' || steps.regions.outputs.needed == 'true')
        shell: bash
        run: |
          set -euo pipefail

          regions="$REGIONS_CONFIG"

          # The validated region configuration was prepared before the source check.
          if [ -n "$regions" ]; then
            test -f "$regions" || {
              echo "::error::Region configuration not found: $regions"
              exit 1
            }

            python3 build_abm.py \
              source/input.osm.pbf \
              --country "$CODE" \
              --regions "$regions" \
              --output dist/ \
              $([ -z "${REGION_CODES:-}" ] || echo --only-regions "$REGION_CODES")
          else
            python3 build_abm.py \
              source/input.osm.pbf \
              --country "$CODE" \
              --output "dist/$CODE.abm"
          fi

          shopt -s nullglob
          files=(dist/*.abm)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Builder produced no .abm file."
            exit 1
          fi

          for f in "${files[@]}"; do
            test -s "$f"
          done

          find dist -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      # ----------------------------------------------------------
      # Release preparation must be done after the actual build.
      # It may split an oversized country/region asset.
      # ----------------------------------------------------------
      - name: Prepare release parts
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for abm in dist/*.abm; do
            code="$(basename "$abm" .abm)"

            python3 release_packaging/prepare_release.py "$code" \
              --dist dist \
              --previous-manifest prev/manifest.json \
              --release-tag "$RELEASE_TAG" \
              --max-asset-bytes "$MAX_ASSET_BYTES"
          done

          shopt -s nullglob
          files=(dist/*.abm)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release ABM files after preparation."
            exit 1
          fi

          for f in "${files[@]}"; do
            size="$(stat -c '%s' "$f")"
            if [ "$size" -gt "$MAX_ASSET_BYTES" ]; then
              echo "::error::$f is $size bytes and exceeds MAX_ASSET_BYTES"
              exit 1
            fi
          done

          find dist -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      # ----------------------------------------------------------
      # Build manifest from the generated files.
      # ----------------------------------------------------------
      - name: Build manifest fragment
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p stage fragment

          python3 release_packaging/build_release_manifest.py dist \
            --release-tag "$RELEASE_TAG" \
            --names countries.json \
            --stage-dir stage \
            -o fragment/manifest.json

          test -s fragment/manifest.json
          find stage -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Validate manifest and generated ABM
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 release_packaging/build_release_manifest.py \
            --validate fragment/manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          m = json.loads(Path("fragment/manifest.json").read_text(encoding="utf-8"))

          if not m:
              raise SystemExit("Manifest is empty")

          # Accept either a countries list or the repository's existing
          # manifest shape, but require a version/hash-bearing manifest.
          text = json.dumps(m)
          required_any = (
              "map_version" in m or
              "schema_version" in m or
              "manifest_hash" in m or
              "assets" in m or
              "countries" in m
          )
          if not required_any:
              raise SystemExit("Manifest does not contain recognized ABM metadata")
          print("Manifest validation passed.")
          PY

      - name: ABM smoke tests
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Run repository tests when present. No fake success is generated.
          if [ -d tests ]; then
            if find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
              python3 -m pytest -q tests
            else
              echo "No pytest tests found; manifest validation remains mandatory."
            fi
          else
            echo "No tests directory found; builder/manifest validation remains mandatory."
          fi

      - name: Create build metadata
        if: always()
        shell: bash
        run: |
          {
            echo "country=$CODE"
            echo "source_changed=${SRC_CHANGED:-unknown}"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-metadata.txt

      - name: Remove source PBF before artifact upload
        if: always()
        run: |
          rm -f source/input.osm.pbf source/headers.txt
          rm -rf .pytest_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || true
          df -h /

      - name: Upload ABM build artifact
        if: steps.source.outputs.changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: abm-${{ matrix.code }}
          path: |
            stage/**
            build-metadata.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload manifest fragment
        if: steps.source.outputs.changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: frag-${{ matrix.code }}
          path: fragment/manifest.json
          if-no-files-found: error
          retention-days: 3

      - name: No rebuild
        if: steps.source.outputs.changed == 'false'
        run: echo "$CODE is unchanged; no PBF download and no ABM rebuild was performed."

  # ------------------------------------------------------------
  # 3) Publish only validated artifacts.
  # ------------------------------------------------------------
  publish:
    name: Publish maps-v4
    needs: [discover, build]
    if: ${{ !cancelled() && needs.discover.result == 'success' && (github.event_name == 'schedule' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release helper files
        run: |
          set -euo pipefail
          test -f release_packaging/build_release_manifest.py
          test -f countries.json

      - name: Prepare publish workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prev frags incoming final repair
          mkdir -p prev frags incoming final repair

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" \
              --pattern manifest.json \
              --dir prev \
              --clobber || true
            gh release view "$RELEASE_TAG" --json assets > assets.json
          else
            printf '%s\n' '{"assets":[]}' > assets.json
          fi

      - name: Download all fragments from this workflow
        shell: bash
        run: |
          set -euo pipefail

          gh run download "$GITHUB_RUN_ID" \
            --pattern 'frag-*' \
            --dir frags || true

          count="$(find frags -type f -name manifest.json | wc -l)"
          echo "Fragments: $count"

          if [ "$count" -eq 0 ] && [ -f prev/manifest.json ]; then
            echo "No country changed; manifest will be retained."
          fi

      - name: Download all newly built ABM artifacts
        shell: bash
        run: |
          set -euo pipefail

          gh run download "$GITHUB_RUN_ID" \
            --pattern 'abm-*' \
            --dir incoming || true

          find incoming -type f -printf '%p %s bytes\n' | sort || true

      - name: Assemble final manifest
        shell: bash
        run: |
          set -euo pipefail

          args=()
          while IFS= read -r f; do
            [ -n "$f" ] && args+=(--current-manifest "$f")
          done < <(find frags -type f -name manifest.json | sort)

          python3 release_packaging/build_release_manifest.py \
            --release-tag "$RELEASE_TAG" \
            --names countries.json \
            --previous-manifest prev/manifest.json \
            --release-assets-json assets.json \
            --asset-dir incoming \
            "${args[@]}" \
            --stale-out stale.txt \
            -o final/manifest.json

          test -s final/manifest.json

      - name: Validate final manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 release_packaging/build_release_manifest.py \
            --validate final/manifest.json \
            --previous-manifest prev/manifest.json

      - name: Ensure release exists
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "AbtinMaps Offline Maps" \
              --notes "AbtinMaps offline ABM map data."
          fi

      # Upload every asset referenced by the fresh manifest.
      # IMPORTANT: gh run download recreates artifact directory structure, so
      # a glob such as incoming/**/*.abm is not reliable unless globstar is
      # enabled. Use find instead, and include split/patch assets too.
      - name: Publish new/changed ABM assets
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(find incoming -type f \( \
            -name '*.abm' -o \
            -name '*.part[0-9][0-9][0-9]' -o \
            -name '*.abmpatch.json' -o \
            -name '*.abmpatch.bin' \
          \) -print | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No ABM release assets were found in downloaded build artifacts."
            find incoming -type f -printf '%p %s bytes\n' | sort || true
            exit 1
          fi

          echo "Assets selected for release upload: ${#files[@]}"

          # De-duplicate by basename. Release assets live at the top level,
          # while downloaded artifacts may contain nested directories.
          declare -A seen_names=()

          for f in "${files[@]}"; do
            [ -f "$f" ] || continue

            name="$(basename "$f")"
            if [ "${seen_names[$name]+yes}" = "yes" ]; then
              echo "::error::Duplicate release asset name detected: $name"
              exit 1
            fi
            seen_names["$name"]=yes

            size="$(stat -c '%s' "$f")"
            if [ "$size" -gt "$MAX_ASSET_BYTES" ]; then
              echo "::error::$f exceeds release asset size limit"
              exit 1
            fi

            ok=false
            for try in 1 2 3; do
              if gh release upload "$RELEASE_TAG" "$f" --clobber; then
                ok=true
                break
              fi
              sleep 20
            done

            if [ "$ok" != "true" ]; then
              echo "::error::Failed to upload $f as $name"
              exit 1
            fi
          done

      # Manifest is uploaded LAST so clients never see a new manifest
      # pointing to assets that have not yet been uploaded.
      - name: Publish final manifest last
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" final/manifest.json --clobber

      - name: Remove stale release assets
        shell: bash
        run: |
          set -euo pipefail

          if [ -s stale.txt ]; then
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes || true
            done < stale.txt
          fi

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## ABM Release"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Run: \`$GITHUB_RUN_ID\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo
            echo "### Manifest"
            echo '```json'
            python3 -m json.tool final/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          rm -rf prev frags incoming final repair assets.json stale.txt
          df -h /
