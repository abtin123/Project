      - name: Build unsigned IPA
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter build ios --release --no-pub --config-only --no-codesign
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -derivedDataPath build/ios_dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" build 2>&1 | tee xcodebuild.log | tail -n 60
          app="build/ios_dd/Build/Products/Release-iphoneos/Runner.app"
          test -d "$app" || { grep -E "error:" xcodebuild.log | head -30; exit 1; }
          rm -rf Payload && mkdir -p Payload release
          cp -R "$app" Payload/
          zip -9 -q -r "release/${APP_NAME}-${TAG}-unsigned.ipa" Payload
          rm -rf Payload
