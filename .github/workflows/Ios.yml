
name: AbtinMaps - Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project
        run: |
          flutter --version
          test -f pubspec.yaml
          test -d ios

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"
          mkdir -p Payload dist
          cp -R "$APP_PATH" Payload/
          cd .
          /usr/bin/zip -qry dist/AbtinMaps-unsigned.ipa Payload
          ls -lh dist/AbtinMaps-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbtinMaps-unsigned-IPA
          path: dist/AbtinMaps-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
