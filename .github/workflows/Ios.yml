
name: AbtinMaps - Build IPA

on:
  workflow_dispatch:


jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project
        run: |
          flutter --version
          test -f pubspec.yaml

      - name: Generate iOS platform
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.abtinmaps .
          fi
          test -f ios/Runner.xcodeproj/project.pbxproj

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS app
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          set -e
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/AbtinMaps.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AbtinMaps-IPA
          path: dist/AbtinMaps.ipa
          if-no-files-found: error
          retention-days: 7
