name: Apk to release (arm64 / armv7 / x86_64)

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'ZIP path in repository (empty = build repository directly)'
        required: false
        default: ''
      flutter_version:
        description: 'Flutter version (empty = latest stable)'
        required: false
        default: ''
      xray_tag:
        description: 'patterniha/AndroidLibXrayLite tag for armv7 / x86_64 libgojni.so (empty = latest)'
        required: false
        default: ''
      publish_release:
        description: 'Also attach APKs and ZIPs to GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a,   platform: android-arm64 }
          - { abi: armeabi-v7a, platform: android-arm }
          - { abi: x86_64,      platform: android-x64 }

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false          # keep Android SDK: sdkmanager and flutter build need it
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Show free disk space
        shell: bash
        run: df -h /

      - uses: actions/checkout@v4

      - name: Find and unzip project
        id: src
        shell: bash
        env:
          ZIP_INPUT: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          ZIP="$ZIP_INPUT"
          rm -rf "$RUNNER_TEMP/src"
          mkdir -p "$RUNNER_TEMP/src"
          if [ -n "$ZIP" ]; then
            [ -f "$ZIP" ] || { echo "::error::ZIP not found: $ZIP"; exit 1; }
            echo "Building from ZIP: $ZIP"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/src"
            ROOT="$RUNNER_TEMP/src"
            NAME="$(basename "$ZIP" .zip)"
          else
            echo "Building repository directly"
            ROOT="$GITHUB_WORKSPACE"
            NAME="repository"
          fi
          PUB="$(find "$ROOT" -maxdepth 5 -name pubspec.yaml -not -path '*/packages/*' -not -path '*/.dart_tool/*' \
            | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)"
          [ -n "$PUB" ] || { echo "::error::pubspec.yaml not found"; exit 1; }
          echo "dir=$(dirname "$PUB")" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Android SDK licenses and platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "platform-tools" >/dev/null || true

      # The signing key comes from the project ZIP (android/keystore + android/key.properties) or from repository
      # secrets. It is only used here, for the build. The release's "Source code" archives never contain it:
      # see the package job (the release tag points to a keystore-free copy of the repository).
      - name: Prepare Android project (local.properties + signing key)
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          FLUTTER_ROOT_DIR="$(dirname "$(dirname "$(which flutter)")")"
          mkdir -p android
          { echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"; echo "flutter.sdk=$FLUTTER_ROOT_DIR"; } > android/local.properties
          chmod +x android/gradlew || true
          mkdir -p android/keystore
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Using repository secrets signing key"
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/ci-release.jks
            printf 'storeFile=keystore/ci-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" > android/key.properties
          elif [ -f android/key.properties ] && grep -q '^storeFile=' android/key.properties && \
               [ -f "android/$(grep '^storeFile=' android/key.properties | cut -d= -f2)" ]; then
            echo "Using project signing key"
          else
            echo "::warning::Generating temporary signing key (updates will not install over a build signed with another key)"
            keytool -genkeypair -v -keystore android/keystore/ci-release.jks -storepass android -keypass android \
              -alias ci -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Abtin CI" >/dev/null 2>&1
            printf 'storeFile=keystore/ci-release.jks\nstorePassword=android\nkeyAlias=ci\nkeyPassword=android\n' > android/key.properties
          fi

      # libgojni.so (Xray core) in the project is arm64-v8a only. PattNG ships the same core for every ABI inside libv2ray.aar
      # (patterniha/AndroidLibXrayLite release). It is used only when its JNI exports are identical to the arm64 lib in the
      # project (the hand-written Java bindings match that build); otherwise this ABI is built without v2ray
      # and the v2ray page shows "unsupported_abi".
      - name: v2ray core for ${{ matrix.abi }}
        if: matrix.abi != 'arm64-v8a'
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          XRAY_TAG: ${{ inputs.xray_tag }}
          ABI: ${{ matrix.abi }}
        run: |
          set +e
          ws="$PWD"
          mkdir -p /tmp/aar && cd /tmp/aar
          if [ -n "$XRAY_TAG" ]; then
            gh release download "$XRAY_TAG" --repo patterniha/AndroidLibXrayLite --pattern libv2ray.aar
          else
            gh release download --repo patterniha/AndroidLibXrayLite --pattern libv2ray.aar
          fi
          [ -f libv2ray.aar ] || { echo "::warning::libv2ray.aar not downloaded: $ABI builds without the v2ray core"; exit 0; }
          unzip -q -o libv2ray.aar 'jni/*' -d x
          repo_fp=$(python3 "$ws/tools/jni_syms.py" "$ws/android/app/src/main/jniLibs/arm64-v8a/libgojni.so")
          aar_fp=$(python3 "$ws/tools/jni_syms.py" x/jni/arm64-v8a/libgojni.so)
          src="x/jni/$ABI/libgojni.so"
          echo "project arm64: $repo_fp"; echo "aar     arm64: $aar_fp"
          [ -f "$src" ] || { echo "::warning::AAR has no $ABI libgojni.so"; exit 0; }
          [ "$repo_fp" = "$aar_fp" ] || { echo "::warning::AAR JNI exports differ from the bundled arm64 core (set xray_tag to the matching release): $ABI builds without v2ray"; exit 0; }
          mkdir -p "$ws/android/app/src/main/jniLibs/$ABI"
          cp "$src" "$ws/android/app/src/main/jniLibs/$ABI/libgojni.so"
          echo "v2ray core for $ABI added"

      - name: Get dependencies
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ steps.src.outputs.dir }}
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK (${{ matrix.abi }})
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter build apk --release --split-per-abi --target-platform ${{ matrix.platform }} --split-debug-info=build/symbols

      - name: Check the APK holds only ${{ matrix.abi }}
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        run: |
          apk="build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk"
          [ -f "$apk" ] || { echo "::error::APK was not generated"; exit 1; }
          abis=$(unzip -Z1 "$apk" | grep -oE '^lib/[^/]+/' | sort -u | tr -d '\n')
          echo "native ABIs in APK: $abis"
          [ "$abis" = "lib/${{ matrix.abi }}/" ] || { echo "::error::wrong ABI set"; exit 1; }
          if grep -rqi "geckoview" android --include=*.gradle --include=*.kts --include=*.properties 2>/dev/null; then
            unzip -Z1 "$apk" | grep -q "lib/${{ matrix.abi }}/libxul.so" || { echo "::error::GeckoView libxul.so missing"; exit 1; }
          else
            echo "GeckoView not used by this project: libxul check skipped"
          fi
          if unzip -Z1 "$apk" | grep -q "lib/${{ matrix.abi }}/libgojni.so"; then echo "v2ray core: included"; else echo "v2ray core: NOT included for this ABI"; fi

      - name: Collect APK
        shell: bash
        env:
          APP_NAME: ${{ steps.src.outputs.name }}
          PROJECT_DIR: ${{ steps.src.outputs.dir }}
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-$ABI-release.apk" "dist/${APP_NAME}-${ABI}.apk"
          ls -lh dist

      - name: Upload APK (temporary, merged by the package job)
        uses: actions/upload-artifact@v4
        with:
          name: tmp-apk-${{ matrix.abi }}
          path: dist/*.apk
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  package:
    name: package (one ZIP per APK)
    needs: apk
    if: ${{ !cancelled() && needs.apk.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # checkout FIRST: it cleans the workspace, so it must run before apks/ and dist/ are created
      - uses: actions/checkout@v4
        if: ${{ inputs.publish_release }}

      - uses: actions/download-artifact@v4
        with:
          pattern: tmp-apk-*
          path: apks
          merge-multiple: true

      - name: One ZIP per APK
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          NAME="${GITHUB_REPOSITORY##*/}-build-${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          for apk in apks/*.apk; do
            b="$(basename "$apk" .apk)"
            zip -9 -X -j "dist/${b}.zip" "$apk"
          done
          ls -lh dist
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/*.zip
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Remove temporary per-ABI artifacts
        uses: geekyeggo/delete-artifact@v5
        continue-on-error: true
        with:
          name: tmp-apk-*

      # GitHub builds the release's "Source code (zip / tar.gz)" from the commit the tag points to.
      # The tag is therefore put on a separate commit (on no branch) in which every signing key is removed:
      #   - key files committed directly (android/keystore/, key.properties, *.jks, *.keystore)
      #   - the same files inside any project ZIP committed in the repository
      # The branch and the original ZIPs stay untouched; the APKs above were already built with the key.
      - name: Tag a keystore-free copy of the source
        if: ${{ inputs.publish_release }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          RE='(^|/)android/keystore/|(^|/)key\.properties$|\.jks$|\.keystore$'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1) signing keys inside project ZIPs
          while IFS= read -r -d '' z; do
            list="$(unzip -Z1 "$z" 2>/dev/null || true)"
            if grep -qE "$RE" <<<"$list"; then
              echo "removing signing key from: $z"
              zip -q -d "$z" '*android/keystore/*' '*key.properties' '*.jks' '*.keystore' || true
              git add -- "$z"
            fi
          done < <(git ls-files -z -- '*.zip')

          # 2) key files committed directly
          while IFS= read -r -d '' f; do
            if grep -qE "$RE" <<<"$f"; then
              echo "removing from source: $f"
              git rm -q --cached -- "$f"
            fi
          done < <(git ls-files -z)

          # 3) verify before tagging (never publish a source archive that still has a key)
          if git ls-files | grep -qE "$RE"; then
            echo "::error::a key file is still tracked"; exit 1
          fi
          while IFS= read -r -d '' z; do
            list="$(unzip -Z1 "$z" 2>/dev/null || true)"
            if grep -qE "$RE" <<<"$list"; then
              echo "::error::signing key still inside $z"; exit 1
            fi
          done < <(git ls-files -z -- '*.zip')

          git commit -q --allow-empty -m "Release $TAG (signing key removed from source)"
          git tag -f "$TAG"
          git push origin "refs/tags/$TAG" --force

      - name: Attach to GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Abtin build ${{ github.run_number }}
          files: dist/*.zip
