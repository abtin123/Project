
name: Bazaar signed bin (from existing release AAB1)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag"
        required: true
        default: "v0.0.17"

permissions:
  contents: write

env:
  RELEASE_REPO: abtin123/Project
  BUNDLESIGNER_VERSION: v0.1.13

jobs:
  sign:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "$KEYSTORE_BASE64" ]] || {
            echo "::error::KEYSTORE_BASE64 is missing"
            exit 1
          }

          [[ -n "$KEYSTORE_PASSWORD" ]] || {
            echo "::error::KEYSTORE_PASSWORD is missing"
            exit 1
          }

          [[ -n "$KEY_ALIAS" ]] || {
            echo "::error::KEY_ALIAS is missing"
            exit 1
          }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore and validate keystore
        shell: bash
        run: |
          set -euo pipefail

          KS_DIR="$RUNNER_TEMP/abtin-signing"
          mkdir -p "$KS_DIR"

          KS="$KS_DIR/abtin-keystore.p12"

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$KS"

          test -s "$KS" || {
            echo "::error::Decoded keystore is empty"
            exit 1
          }

          keytool -list \
            -keystore "$KS" \
            -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" >/dev/null

          chmod 600 "$KS"

          echo "ABTIN_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "ABTIN_KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"

          echo "Keystore successfully restored and validated."

      - name: Download AAB from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dl dist/bin dl/extracted

          gh release view "$TAG" --repo "$RELEASE_REPO"

          gh release download "$TAG" \
            --repo "$RELEASE_REPO" \
            --dir dl

          while IFS= read -r -d '' FILE; do
            case "$FILE" in
              *.aab)
                cp "$FILE" dl/extracted/
                ;;
              *.zip)
                DEST="dl/extracted/$(basename "$FILE" .zip)"
                mkdir -p "$DEST"
                unzip -o -q "$FILE" -d "$DEST"
                ;;
            esac
          done < <(
            find dl -maxdepth 1 -type f \
              \( -iname '*.zip' -o -iname '*.aab' \) -print0
          )

          mapfile -t AABS < <(
            find dl/extracted -type f -iname '*.aab'
          )

          if [[ "${#AABS[@]}" -eq 0 ]]; then
            echo "::error::No AAB found in release assets"
            exit 1
          fi

          if [[ "${#AABS[@]}" -ne 1 ]]; then
            echo "::error::Multiple AAB files found:"
            printf '%s\n' "${AABS[@]}"
            exit 1
          fi

          cp "${AABS[0]}" dist/app-release.aab

          echo "Selected AAB:"
          ls -lh dist/app-release.aab

      - name: Download Bazaar bundle signer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools

          gh release download "$BUNDLESIGNER_VERSION" \
            --repo cafebazaar/bundle-signer \
            --pattern '*.jar' \
            --dir tools

          mapfile -t JARS < <(
            find tools -maxdepth 1 -type f -name '*.jar'
          )

          if [[ "${#JARS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one bundle-signer JAR"
            exit 1
          fi

          echo "BUNDLE_SIGNER_JAR=${JARS[0]}" >> "$GITHUB_ENV"

      - name: Generate signed BIN
        shell: bash
        run: |
          set -euo pipefail

          java -jar "$BUNDLE_SIGNER_JAR" genbin \
            -v \
            --bundle dist/app-release.aab \
            --bin dist/bin \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --ks "$ABTIN_KEYSTORE_PATH" \
            --ks-type "$ABTIN_KEYSTORE_TYPE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD

          mapfile -t BINS < <(
            find dist/bin -maxdepth 1 -type f -name '*.bin'
          )

          if [[ "${#BINS[@]}" -eq 0 ]]; then
            echo "::error::No BIN file generated"
            exit 1
          fi

          ls -lh "${BINS[@]}"

      - name: Upload BIN to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$TAG" \
            dist/bin/*.bin \
            --repo "$RELEASE_REPO" \
            --clobber

          echo "BIN uploaded successfully."

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/abtin-signing"
