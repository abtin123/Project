name: Flatten Repo Layout

on:
  workflow_dispatch:
    inputs:
      nested_folder:
        description: 'اسم پوشه‌ی تو در تویی که باید محتوایش بیاد بیرون'
        required: false
        default: 'abtin-maps-main'

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move nested folder contents to repo root
        run: |
          SRC="${{ github.event.inputs.nested_folder }}"
          if [ ! -d "$SRC" ]; then
            echo "پوشه‌ی $SRC پیدا نشد، کاری برای انجام نیست."
            exit 0
          fi
          shopt -s dotglob
          for item in "$SRC"/*; do
            name=$(basename "$item")
            if [ -e "$name" ] && [ "$name" != "$SRC" ]; then
              echo "هشدار: $name از قبل توی ریشه هست، بازنویسی می‌شود."
              rm -rf "./$name"
            fi
            git mv "$item" "./$name"
          done
          rmdir "$SRC" 2>/dev/null || rm -rf "$SRC"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: flatten repo layout, remove nested ${{ github.event.inputs.nested_folder }}/" || echo "چیزی برای کامیت نبود"
          git push
