name: Release (Android + iOS)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag for this release, for example v1.0.0
        required: true
        type: string

      release_name:
        description: Visible GitHub Release title
        required: false
        type: string

      source_zip:
        description: Path to the source ZIP inside the repository (leave empty to auto-detect the only ZIP in the repo)
        required: false
        type: string

      artifact_name:
        description: Base name for the built files (defaults to the app name from pubspec.yaml)
        required: false
        type: string

      build_ios:
        description: Also build the iOS IPA (needs a macOS runner)
        required: false
        type: boolean
        default: true

      ios_export_method:
        description: iOS export method (only used when the iOS signing secrets are set)
        required: false
        type: choice
        default: release-testing
        options:
          - release-testing   # ad-hoc: install on devices listed in the provisioning profile
          - app-store-connect # upload to App Store / TestFlight
          - debugging         # development profile
          - enterprise

permissions:
  contents: write

jobs:
  # ==================================================================
  # PREPARE: find + validate the source ZIP once, share with all jobs
  # ==================================================================
  prepare:
    name: Detect and validate source ZIP
    runs-on: ubuntu-latest
    outputs:
      source_zip: ${{ steps.detect.outputs.source_zip }}
      app_subdir: ${{ steps.detect.outputs.app_subdir }}
      app_name: ${{ steps.detect.outputs.app_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect Flutter project inside the ZIP
        id: detect
        shell: bash
        env:
          SOURCE_ZIP: ${{ inputs.source_zip }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail

          source_zip="$SOURCE_ZIP"

          if [ -z "$source_zip" ]; then
            mapfile -t found_zips < <(
              find . \
                -maxdepth 4 \
                -type f \
                -iname '*.zip' \
                -not -path '*/.git/*' \
                | sort
            )

            test "${#found_zips[@]}" -ge 1 || {
              echo 'No ZIP file found in the repository.'
              exit 1
            }

            test "${#found_zips[@]}" -eq 1 || {
              echo "Multiple ZIP files found; pass source_zip explicitly:"
              printf '  %s\n' "${found_zips[@]}"
              exit 1
            }

            source_zip="${found_zips[0]#./}"
            echo "Auto-detected source ZIP: $source_zip"
          fi

          case "$source_zip" in
            ''|/*|*'..'*)
              echo 'source_zip must be a relative path inside the repository.'
              exit 1
              ;;
          esac

          test -s "$source_zip" || {
            echo "Missing source ZIP: $source_zip"
            exit 1
          }

          # ZIP Slip protection
          if unzip -Z1 "$source_zip" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe path found in source ZIP.'
            exit 1
          fi

          # pubspec.yaml at the ZIP root or exactly one folder deep
          mapfile -t pubspecs < <(
            unzip -Z1 "$source_zip" | grep -E '^([^/]+/)?pubspec\.yaml$' || true
          )

          test "${#pubspecs[@]}" -eq 1 || {
            echo "Expected one Flutter project in source ZIP; found ${#pubspecs[@]}."
            exit 1
          }

          pubspec_entry="${pubspecs[0]}"
          app_subdir="$(dirname "$pubspec_entry")"

          app_name="$ARTIFACT_NAME"

          if [ -z "$app_name" ]; then
            app_name=$(
              unzip -p "$source_zip" "$pubspec_entry" \
                | sed -n 's/^name:[[:space:]]*//p' \
                | head -n1 \
                | tr -d '\r'
            )

            test -n "$app_name" || {
              echo 'Could not determine app name from pubspec.yaml.'
              echo 'Pass artifact_name manually.'
              exit 1
            }
          fi

          {
            echo "source_zip=$source_zip"
            echo "app_subdir=$app_subdir"
            echo "app_name=$app_name"
          } >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "Source ZIP:   $source_zip"
          echo "Project dir:  $app_subdir"
          echo "Artifact name: $app_name"
          echo "=========================================="


  # ==================================================================
  # ANDROID: signed APK + AAB
  # ==================================================================
  android:
    name: Build signed APK and AAB
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ---------------- free disk space ----------------
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail

          echo "== Before cleanup =="
          df -h /

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup

          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/ndk

          sudo docker image prune --all --force 2>/dev/null || true
          sudo docker builder prune --all --force 2>/dev/null || true

          sudo apt-get remove -y \
            '^aspnetcore-.*' \
            '^dotnet-.*' \
            '^llvm-.*' \
            'php.*' \
            '^mongodb-.*' \
            '^mysql-.*' \
            azure-cli \
            google-chrome-stable \
            firefox \
            powershell \
            mono-devel \
            libgl1-mesa-dri \
            google-cloud-cli \
            --fix-missing -qq >/dev/null 2>&1 || true

          sudo apt-get autoremove -y -qq >/dev/null 2>&1 || true
          sudo apt-get clean

          echo "== After cleanup =="
          df -h /

      # ---------------- unpack ----------------
      - name: Unpack Flutter source
        shell: bash
        env:
          SOURCE_ZIP: ${{ needs.prepare.outputs.source_zip }}
          APP_SUBDIR: ${{ needs.prepare.outputs.app_subdir }}
          APP_NAME: ${{ needs.prepare.outputs.app_name }}
        run: |
          set -euo pipefail

          unpack_dir="$RUNNER_TEMP/source-unpacked"
          rm -rf "$unpack_dir"
          mkdir -p "$unpack_dir"
          unzip -q "$SOURCE_ZIP" -d "$unpack_dir"

          if [ "$APP_SUBDIR" = "." ]; then
            app_dir="$unpack_dir"
          else
            app_dir="$unpack_dir/$APP_SUBDIR"
          fi

          test -f "$app_dir/android/app/build.gradle" || {
            echo 'Missing Android app build configuration.'
            exit 1
          }

          echo "APP_DIR=$app_dir" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager="${ANDROID_HOME:?ANDROID_HOME is not set}/cmdline-tools/latest/bin/sdkmanager"

          test -x "$sdkmanager" || {
            echo 'Android SDK command-line tools are unavailable.'
            exit 1
          }

          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          sdkmanager_status=${PIPESTATUS[1]}
          set -o pipefail

          test "$sdkmanager_status" -eq 0 || {
            echo 'Android SDK license acceptance failed.'
            exit 1
          }

          "$sdkmanager" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          cache: true

      - name: Show Flutter and Android versions
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          flutter --version
          flutter doctor -v

      - name: Fetch Flutter packages from extracted source
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze source
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos

      - name: Run nonvisual tests
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -d test ]; then
            mapfile -t tests < <(
              find test \
                -type f \
                -name '*_test.dart' \
                ! -path 'test/visual/*' \
                | sort
            )
          else
            tests=()
          fi

          if [ "${#tests[@]}" -eq 0 ]; then
            echo 'No nonvisual tests were found; skipping test step.'
          else
            flutter test --no-pub "${tests[@]}"
          fi

      - name: Build signed release APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub

      - name: Build signed release AAB
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter build appbundle --release --no-pub

      - name: Compress APK and AAB
        id: package_release
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          apk="build/app/outputs/flutter-apk/app-release.apk"
          aab="build/app/outputs/bundle/release/app-release.aab"

          test -s "$apk" || { echo 'Signed APK was not produced.'; exit 1; }
          test -s "$aab" || { echo 'Signed AAB was not produced.'; exit 1; }

          mkdir -p release

          apk_name="${APP_NAME}-${TAG}.apk"
          aab_name="${APP_NAME}-${TAG}.aab"
          apk_zip="${APP_NAME}-${TAG}.apk.zip"
          aab_zip="${APP_NAME}-${TAG}.aab.zip"

          cp "$apk" "release/$apk_name"
          cp "$aab" "release/$aab_name"

          ( cd release && zip -9 -q "$apk_zip" "$apk_name" )
          ( cd release && zip -9 -q "$aab_zip" "$aab_name" )

          rm -f "release/$apk_name" "release/$aab_name"

          test -s "release/$apk_zip" || { echo 'APK ZIP was not produced.'; exit 1; }
          test -s "release/$aab_zip" || { echo 'AAB ZIP was not produced.'; exit 1; }

          ls -lh release/

          echo "apk_zip=$PWD/release/$apk_zip" >> "$GITHUB_OUTPUT"
          echo "aab_zip=$PWD/release/$aab_zip" >> "$GITHUB_OUTPUT"

      - name: Upload Android release files
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          if-no-files-found: error
          path: |
            ${{ steps.package_release.outputs.apk_zip }}
            ${{ steps.package_release.outputs.aab_zip }}


  # ==================================================================
  # IOS: IPA (signed if secrets exist, otherwise unsigned)
  # ==================================================================
  ios:
    name: Build iOS IPA
    needs: prepare
    if: ${{ inputs.build_ios }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ---------------- unpack ----------------
      - name: Unpack Flutter source
        shell: bash
        env:
          SOURCE_ZIP: ${{ needs.prepare.outputs.source_zip }}
          APP_SUBDIR: ${{ needs.prepare.outputs.app_subdir }}
          APP_NAME: ${{ needs.prepare.outputs.app_name }}
        run: |
          set -euo pipefail

          unpack_dir="$RUNNER_TEMP/source-unpacked"
          rm -rf "$unpack_dir"
          mkdir -p "$unpack_dir"
          unzip -q "$SOURCE_ZIP" -d "$unpack_dir"

          if [ "$APP_SUBDIR" = "." ]; then
            app_dir="$unpack_dir"
          else
            app_dir="$unpack_dir/$APP_SUBDIR"
          fi

          test -d "$app_dir/ios/Runner.xcodeproj" || {
            echo 'Missing ios/Runner.xcodeproj in the source ZIP.'
            exit 1
          }

          echo "APP_DIR=$app_dir" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          cache: true

      - name: Show Flutter and Xcode versions
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          flutter --version
          xcodebuild -version

      - name: Fetch Flutter packages from extracted source
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      # ---------------- decide signed / unsigned ----------------
      - name: Check iOS signing secrets
        id: signing
        shell: bash
        env:
          IOS_P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "$IOS_P12" ] && [ -n "$IOS_P12_PASSWORD" ] && [ -n "$IOS_PROFILE" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "iOS signing secrets found: building a SIGNED IPA."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS signing secrets not set: building an UNSIGNED IPA (for sideloading / re-signing only)."
          fi

      # ---------------- signed path ----------------
      - name: Install certificate and provisioning profile
        if: steps.signing.outputs.signed == 'true'
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        env:
          IOS_P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          EXPORT_METHOD: ${{ inputs.ios_export_method }}
        run: |
          set -euo pipefail

          keychain="$RUNNER_TEMP/abtin-build.keychain-db"
          keychain_pw="$(uuidgen)"

          echo "$IOS_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$keychain" \
            -P "$IOS_P12_PASSWORD" \
            -A -t cert -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_pw" \
            "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identities="$(security find-identity -v -p codesigning "$keychain")"
          identity="$(printf '%s\n' "$identities" | grep -m1 -oE '"[^"]+"' | tr -d '"' || true)"

          test -n "$identity" || {
            echo 'No valid code-signing identity found in the .p12.'
            exit 1
          }

          # provisioning profile
          profile_file="$RUNNER_TEMP/profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"

          echo "$IOS_PROFILE" | base64 --decode > "$profile_file"
          security cms -D -i "$profile_file" > "$profile_plist"

          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_file" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

          # bundle id of the Runner target (RunnerTests excluded)
          bundle_id="$(
            awk '/PRODUCT_BUNDLE_IDENTIFIER =/ && !/RunnerTests/ {
              gsub(/(.*= *"?)|("?;.*)/, ""); print; exit
            }' ios/Runner.xcodeproj/project.pbxproj
          )"

          test -n "$bundle_id" || {
            echo 'Could not read the bundle identifier from the Xcode project.'
            exit 1
          }

          # Manual signing for the Runner target only (Pods are not affected,
          # because only the Runner target uses Flutter/Release.xcconfig).
          {
            echo ""
            echo "CODE_SIGN_STYLE = Manual"
            echo "DEVELOPMENT_TEAM = $team_id"
            echo "PROVISIONING_PROFILE_SPECIFIER = $profile_name"
            echo "CODE_SIGN_IDENTITY = $identity"
            echo "CODE_SIGN_IDENTITY[sdk=iphoneos*] = $identity"
          } >> ios/Flutter/Release.xcconfig

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$EXPORT_METHOD</string>
            <key>teamID</key>
            <string>$team_id</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>$identity</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$bundle_id</key>
              <string>$profile_name</string>
            </dict>
          </dict>
          </plist>
          EOF

          {
            echo "IOS_KEYCHAIN=$keychain"
            echo "IOS_PROFILE_PATH=$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
            echo "IOS_EXPORT_OPTIONS=$RUNNER_TEMP/ExportOptions.plist"
          } >> "$GITHUB_ENV"

          echo "Bundle ID:  $bundle_id"
          echo "Team ID:    $team_id"
          echo "Profile:    $profile_name"
          echo "Identity:   $identity"
          echo "Method:     $EXPORT_METHOD"

      - name: Build signed IPA
        if: steps.signing.outputs.signed == 'true'
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          flutter build ipa \
            --release \
            --no-pub \
            --export-options-plist="$IOS_EXPORT_OPTIONS"

          mapfile -t ipas < <(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa')
          test "${#ipas[@]}" -eq 1 || {
            echo "Expected exactly one IPA, found ${#ipas[@]}."
            exit 1
          }

          mkdir -p release
          cp "${ipas[0]}" "release/${APP_NAME}-${TAG}.ipa"

      # ---------------- unsigned path ----------------
      - name: Build unsigned IPA
        if: steps.signing.outputs.signed != 'true'
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          flutter build ios \
            --release \
            --no-codesign \
            --no-pub

          app="build/ios/iphoneos/Runner.app"
          test -d "$app" || {
            echo 'Runner.app was not produced.'
            exit 1
          }

          work="$RUNNER_TEMP/ipa-work"
          rm -rf "$work"
          mkdir -p "$work/Payload" release

          cp -R "$app" "$work/Payload/"

          out="$PWD/release/${APP_NAME}-${TAG}-unsigned.ipa"
          ( cd "$work" && zip -qry "$out" Payload )

      - name: Verify IPA
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ls -lh release/
          for f in release/*.ipa; do
            test -s "$f" || { echo "Empty IPA: $f"; exit 1; }
            unzip -l "$f" | grep -q 'Payload/Runner.app/' || {
              echo "IPA does not contain Payload/Runner.app: $f"
              exit 1
            }
          done

      - name: Upload iOS release files
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          if-no-files-found: error
          path: ${{ env.APP_DIR }}/release/*.ipa

      - name: Clean up signing material
        if: ${{ always() && steps.signing.outputs.signed == 'true' }}
        shell: bash
        run: |
          security delete-keychain "${IOS_KEYCHAIN:-}" 2>/dev/null || true
          rm -f "${IOS_PROFILE_PATH:-}" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/profile.mobileprovision" 2>/dev/null || true


  # ==================================================================
  # PUBLISH: one GitHub Release with everything
  # ==================================================================
  publish:
    name: Publish GitHub Release
    needs: [android, ios]
    if: ${{ !cancelled() && needs.android.result == 'success' && (needs.ios.result == 'success' || needs.ios.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download built files
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lh dist/

      - name: Publish APK, AAB and IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name || inputs.tag }}
          generate_release_notes: true
          files: dist/*
