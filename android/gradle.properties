# سقف محافظه‌کارانهٔ حافظه برای Gradle، Kotlin و فرایندهای native هم‌زمان.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx512m
# اجرای in-process از JVM دوم Kotlin جلوگیری می‌کند؛ این پروژه pluginهای بومی
# متعددی دارد و در runner کم‌حافظه، daemon مستقل هنگام compileReleaseKotlin
# می‌تواند بدون stacktrace توسط سیستم متوقف شود.
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.caching=true

android.useAndroidX=true
# Jetifier دیگر لازم نیست (همه‌ی وابستگی‌ها AndroidX هستند) و فقط حافظه و زمان
# بیلد را زیاد می‌کند.
android.enableJetifier=false

# جلوگیری از بازنویسی خودکار android/app/build.gradle توسط ابزار Flutter
flutter.suppressGradleUpgradeWarning=true

# برخی dependencyها bytecode قدیمی‌تر دارند؛ target برنامه Java/Kotlin 21 است.
kotlin.jvm.target.validation.mode=warning
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
