import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "ir.abtin.abtin_maps"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_21
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "ir.abtin.abtin_maps"
        // marker فلش داخلی Flutter روی Android به API 24 نیاز دارد.
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // فقط زبان‌ها فیلتر می‌شوند. فیلترِ چگالی (xxhdpi/xxxhdpi) در AGP جدید
        // منسوخ شده و باعث خطای لینکِ منابع (aapt2) می‌شد.
        resourceConfigurations += ["fa", "en"]
    }

    def keystorePropsFile = rootProject.file('key.properties')
    def keystoreProps = new Properties()
    def hasKeystoreProps = keystorePropsFile.exists()
    if (hasKeystoreProps) {
        keystorePropsFile.withReader('UTF-8') { reader -> keystoreProps.load(reader) }
    }

    // اولویت با android/key.properties (لوکال) سپس متغیرهای محیطی CI
    // (ABTIN_KEYSTORE_PATH/PASSWORD/ALIAS/KEY_PASSWORD) — هیچ‌کدام hardcode نشده.
    def ksStorePath = hasKeystoreProps ? keystoreProps['storeFile'] : System.getenv('ABTIN_KEYSTORE_PATH')
    def ksStorePassword = hasKeystoreProps ? keystoreProps['storePassword'] : System.getenv('ABTIN_KEYSTORE_PASSWORD')
    def ksKeyAlias = hasKeystoreProps ? keystoreProps['keyAlias'] : System.getenv('ABTIN_KEYSTORE_ALIAS')
    def ksKeyPassword = hasKeystoreProps ? keystoreProps['keyPassword'] : System.getenv('ABTIN_KEYSTORE_KEY_PASSWORD')
    def ksStoreType = hasKeystoreProps
        ? (keystoreProps['storeType'] ?: (ksStorePath?.toString()?.toLowerCase()?.endsWith('.p12') ? 'PKCS12' : null))
        : System.getenv('ABTIN_KEYSTORE_TYPE')
    def hasSigningConfig = ksStorePath && ksStorePassword && ksKeyAlias && ksKeyPassword

    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile rootProject.file(ksStorePath)
                if (ksStoreType) storeType ksStoreType
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // assetهای پروژه در release بدون minify/resource shrink ساخته می‌شوند.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    gradle.taskGraph.whenReady { graph ->
        def releaseRequested = graph.allTasks.any { task ->
            task.name.toLowerCase().contains('release')
        }
        if (releaseRequested && !hasSigningConfig) {
            throw new GradleException(
                'Release signing is required. Add android/key.properties locally or provide ABTIN_KEYSTORE_PATH, ABTIN_KEYSTORE_PASSWORD, ABTIN_KEYSTORE_ALIAS and ABTIN_KEYSTORE_KEY_PASSWORD in CI.'
            )
        }
    }

    packagingOptions {
        pickFirst "lib/**/libc++_shared.so"
        pickFirst "lib/**/libjsc.so"
    }

}

flutter {
    source '../..'
}

